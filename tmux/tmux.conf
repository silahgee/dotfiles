# Enable mouse support
set -g mouse on

# Increase scrollback buffer history
set -g history-limit 10000

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Use Vim shortcuts in copy mode
setw -g mode-keys vi

# Unbind the default prefix
unbind C-b

# Set the new prefix to Ctrl+a
set-option -g prefix C-a
bind-key C-a send prefix

# Keep the cursor in place and prevent snapping to the bottom on mouse select
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Kill pane instantly without the y/n prompt
bind-key x kill-pane

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %
